<header
  class="fixed top-0 left-0 w-full bg-white/80 backdrop-blur border-b z-50"
>
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <!-- LOGO -->
    <div class="text-xl font-bold text-gray-900 flex items-center gap-2">
      <img
        src="assets/images/bws-apigen-logo.png"
        alt="BWS ApiGen"
        class="w-16"
      />
      <a href="#" class="hover:text-blue-800 transition">
        <span class="text-blue-600 hover:text-blue-800">BWS</span> ApiGen
      </a>
    </div>

    <!-- MENU -->
    <nav class="hidden md:flex items-center gap-8 text-sm text-gray-600">
      <a href="#hero" class="hover:text-blue-600 transition">Presentation</a>
      <a href="#demo" class="hover:text-blue-600 transition">Demonstration</a>
      <a href="#features" class="hover:text-blue-600 transition">Features</a>
      <a href="#how-it-works" class="hover:text-blue-600 transition"
        >How it works</a
      >
      <a href="#installation" class="hover:text-blue-600 transition">Install</a>
      <a href="#limitation" class="hover:text-blue-600 transition"
        >Limitations</a
      >
      <a href="#pricing" class="hover:text-blue-600 transition">Pricing</a>
    </nav>

    <!-- CTA -->
    <div class="flex items-center gap-4">
      <button
        (click)="goTo('login')"
        class="text-sm text-gray-600 hover:text-gray-900"
      >
        Login
      </button>

      <button
        (click)="goTo('register')"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition"
      >
        Get started
      </button>
    </div>
  </div>
</header>
