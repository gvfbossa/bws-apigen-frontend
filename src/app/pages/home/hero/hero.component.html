<section
  class="relative min-h-screen flex items-center justify-center bg-gradient-to-br from-white via-blue-50 to-white px-6 overflow-hidden mt-8"
  id="hero">
  <!-- BACKGROUND DECOR -->
  <div class="absolute inset-0 pointer-events-none">
    <div
      class="absolute top-20 left-10 w-72 h-72 bg-blue-200 rounded-full blur-3xl opacity-30"
    ></div>
    <div
      class="absolute bottom-20 right-10 w-72 h-72 bg-indigo-200 rounded-full blur-3xl opacity-30"
    ></div>
  </div>

  <div class="relative max-w-5xl text-center">
    <!-- BADGE -->
    <div
      class="inline-block mb-6 px-4 py-1 rounded-full bg-blue-100 text-blue-700 text-sm font-medium"
    >
      ⚡ Generate APIs in seconds
    </div>

    <!-- HEADLINE -->
    <h1 class="text-5xl md:text-6xl font-bold text-gray-900 leading-tight">
      Stop writing boilerplate
      <br />
      Generate Spring APIs
      <span class="text-blue-600">instantly</span>
    </h1>

    <!-- SUBTEXT -->
    <p class="mt-6 text-lg md:text-xl text-gray-600 max-w-2xl mx-auto">
      Turn your
      <span class="font-semibold text-blue-600">&#64;Entity</span>
      classes into production-ready REST APIs with a single command.
    </p>

    <!-- CTA -->
    <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
      <button
        (click)="goTo('register')"
        class="bg-blue-600 text-white px-8 py-4 rounded-xl font-semibold text-lg hover:bg-blue-700 transition"
      >
        🚀 Get Started
      </button>

      <button
        class="border border-gray-300 px-8 py-4 rounded-xl text-lg hover:bg-gray-100 transition"
        (click)="scrollToDemo()"
      >
        ▶ Watch Demo
      </button>
    </div>

    <!-- CLI PREVIEW -->
    <div
  #terminal
  class="mt-12 bg-gray-900 text-green-400 font-mono text-left p-6 rounded-2xl shadow-lg max-w-2xl mx-auto text-sm leading-relaxed h-[300px] overflow-hidden"
>

  <!-- comando -->
  <div>
    {{ displayedCommand }}
    <span *ngIf="isTyping" class="ml-1 animate-pulse">|</span>
  </div>

  <!-- output -->
  <div
    *ngFor="let line of visibleLines"
    class="text-gray-400 mt-1 transition-all duration-300"
  >
    {{ line }}
  </div>

</div>
  </div>
</section>
