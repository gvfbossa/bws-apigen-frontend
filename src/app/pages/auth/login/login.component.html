<section class="min-h-screen flex items-center justify-center bg-gray-50 px-6">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-gray-900 text-center">Welcome back</h2>

    <p class="text-sm text-gray-500 text-center mt-2">
      Login to continue generating APIs
    </p>

    <!-- Form com Reactive Forms -->
    <form [formGroup]="form" (ngSubmit)="submit($event)" class="mt-6 space-y-5">
      <!-- EMAIL -->
      <div>
        <label class="text-sm text-gray-600">Email</label>
        <input
          type="email"
          placeholder="you@email.com"
          formControlName="email"
          class="w-full mt-1 px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
        />
        <div
          *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
          class="text-red-500 text-xs mt-1"
        >
          Please enter a valid email
        </div>
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="text-sm text-gray-600">Password</label>
        <input
          type="password"
          placeholder="••••••••"
          formControlName="password"
          class="w-full mt-1 px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
        />
        <div
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          class="text-red-500 text-xs mt-1"
        >
          Password is required
        </div>
      </div>

      <!-- SUBMIT -->
      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
      >
        <div
          *ngIf="loading"
          class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
        ></div>

        <span>
          {{ loading ? "Logging In..." : "Login" }}
        </span>
      </button>
    </form>

    <!-- EXTRA LINKS -->
    <div class="mt-6 text-center text-sm text-gray-500">
      <p>
        Don’t have an account?
        <a routerLink="/register" class="text-blue-600 hover:underline hover:cursor-pointer">
          Create one
        </a>
      </p>
      <p>
        Forgot your password?
        <a href="mailto:contato@bossawebsolutions.com.br" target="_blank" class="text-blue-600 hover:underline mt-8">
          Contact us
        </a>
      </p>
    </div>
    <div class="text-center py-2 space-y-1">
      <span *ngIf="successLogin" class="text-sm text-green-600 block">
        Successfully Logged In!
      </span>
      <span *ngIf="errorLogin" class="text-sm text-red-600 block">
        Log In Error, please contact Support
      </span>
    </div>
  </div>
</section>
